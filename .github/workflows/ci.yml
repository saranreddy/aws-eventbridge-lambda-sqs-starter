name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5"

      - name: Terraform Format Check
        run: cd infra && terraform fmt -check -recursive

      - name: Terraform Init
        run: cd infra && terraform init -backend=false

      - name: Terraform Validate
        run: cd infra && terraform validate

  python:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check scripts/ src/

      - name: Black check
        run: black --check scripts/ src/

      - name: isort check
        run: isort --check scripts/ src/

      - name: Type check with mypy
        run: mypy --install-types --non-interactive scripts/ src/ || true
